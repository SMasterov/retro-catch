<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Ретро-ловушка · СиСиСиПи Геймс</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20302c; --ink2:#31463f; --ink3:#16241f;
    --cream:#f7ecd7; --cream2:#efe0c2; --paper:#fff8ea;
    --tomato:#e04a3a; --tomato2:#b93325; --amber:#f2b134; --amber2:#d99a1b;
    --teal:#1f6f6b; --teal2:#155451; --sky:#8ecae6; --grass:#6aa84f; --grass2:#4c8340;
    --success:#3f8f4f; --danger:#c0392b; --info:#2b6f9e;
    --display:"Russo One","Rubik",system-ui,sans-serif;
    --body:"Rubik",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  html{scrollbar-color:var(--tomato) var(--ink3);scrollbar-width:thin}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:var(--ink3)}
  ::-webkit-scrollbar-thumb{background:linear-gradient(var(--tomato),var(--tomato2));border-radius:8px;border:2px solid var(--ink3)}
  ::-webkit-scrollbar-thumb:hover{background:linear-gradient(var(--amber),var(--amber2))}
  body{position:fixed;inset:0;font-family:var(--body);color:var(--ink);background:var(--ink3);
    touch-action:manipulation;overscroll-behavior:none}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
  /* ------- top HUD ------- */
  #topHud{position:fixed;top:0;left:0;right:0;z-index:40;pointer-events:none;
    display:flex;align-items:center;gap:7px;
    padding:calc(env(safe-area-inset-top,0px) + 7px) 9px 10px;
    background:linear-gradient(180deg,rgba(22,36,31,.95),rgba(22,36,31,.8) 60%,rgba(22,36,31,0))}
  #logoChip{pointer-events:auto;display:flex;align-items:center;gap:6px;cursor:pointer;
    border:2px solid var(--ink3);border-radius:13px;padding:4px 8px 4px 5px;
    background:linear-gradient(135deg,var(--teal),var(--teal2));box-shadow:0 3px 0 var(--ink3)}
  #logoChip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink3)}
  #logoChip svg{width:25px;height:25px;display:block}
  #logoChip .nm{font-family:var(--display);font-size:9px;letter-spacing:.8px;color:var(--paper);line-height:1.2;text-align:left}
  #logoChip .nm small{display:block;font-family:var(--body);font-weight:700;font-size:7px;letter-spacing:1.4px;color:var(--amber)}
  #lives{display:flex;gap:3px;align-items:center;background:rgba(255,248,234,.92);border:2px solid var(--ink);
    border-radius:999px;padding:4px 7px;min-height:26px}
  #lives svg{width:13px;height:17px;display:block}
  #scoreBox{margin:0 auto;text-align:center;min-width:64px}
  #scoreLabel{font-size:8px;font-weight:900;letter-spacing:2px;color:var(--amber);text-shadow:0 1px 0 var(--ink)}
  #score{font-family:var(--display);font-size:26px;line-height:1.05;color:var(--paper);
    text-shadow:0 2px 0 var(--ink),0 0 14px rgba(32,48,44,.5);transition:transform .12s}
  #score.pop{transform:scale(1.25)}
  #combo{display:none;margin-top:2px;font-size:9px;font-weight:900;letter-spacing:1px;color:var(--ink);
    background:linear-gradient(135deg,var(--amber),var(--amber2));border:2px solid var(--ink);border-radius:999px;padding:1px 7px}
  #combo.on{display:inline-block;animation:pulse .5s infinite alternate}
  @keyframes pulse{from{transform:scale(1)}to{transform:scale(1.09)}}
  #bestChip{font-size:9px;font-weight:900;letter-spacing:.6px;color:var(--ink);white-space:nowrap;
    background:rgba(255,248,234,.92);border:2px solid var(--ink);border-radius:999px;padding:4px 8px}
  .iconBtn{pointer-events:auto;width:35px;height:35px;flex:0 0 auto;border-radius:50%;cursor:pointer;
    border:2px solid var(--ink3);display:flex;align-items:center;justify-content:center;color:var(--ink);
    background:linear-gradient(135deg,var(--amber),var(--amber2));box-shadow:0 3px 0 var(--ink3)}
  .iconBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink3)}
  .iconBtn svg{width:16px;height:16px;display:block}
  .iconBtn.red{background:linear-gradient(135deg,#f0685a,var(--tomato2));color:var(--paper)}
  #speedBar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,248,234,.16)}
  #speedFill{height:100%;width:8%;background:linear-gradient(90deg,var(--teal),var(--amber),var(--tomato));
    box-shadow:0 0 8px rgba(242,177,52,.7);transition:width .4s}
  /* ------- bottom dock ------- */
  #dock{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:7px;align-items:stretch;
    padding:9px 9px calc(env(safe-area-inset-bottom,0px) + 9px);
    background:linear-gradient(0deg,rgba(22,36,31,.96),rgba(22,36,31,.82) 62%,rgba(22,36,31,0))}
  #segDock{flex:0 0 118px;display:flex;border:2px solid var(--ink3);border-radius:13px;overflow:hidden;box-shadow:0 3px 0 var(--ink3)}
  #segDock button{flex:1;min-width:0;font-family:var(--body);font-weight:900;font-size:10px;letter-spacing:.4px;
    padding:10px 2px;border:none;cursor:pointer;background:var(--cream2);color:var(--ink2);white-space:nowrap}
  #segDock button.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--paper)}
  .dockBtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;
    font-family:var(--body);font-weight:900;font-size:10px;letter-spacing:.8px;padding:10px 4px;border-radius:13px;
    border:2px solid var(--ink3);background:linear-gradient(180deg,var(--paper),var(--cream));color:var(--ink);
    box-shadow:0 3px 0 var(--ink3)}
  .dockBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink3)}
  .dockBtn.warn{background:linear-gradient(135deg,var(--amber),var(--amber2))}
  .dockBtn svg{width:13px;height:13px;flex:0 0 auto;display:block}
  .dockBtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (max-width:430px){ .dockBtn span{display:none} #segDock{flex:0 0 104px} }
  @media (max-width:400px){ #logoChip .nm{display:none} }
  /* ------- toast ------- */
  #toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 74px);z-index:95;pointer-events:none;
    transform:translate(-50%,-14px) scale(.72);opacity:0;max-width:88vw;text-align:center;
    font-family:var(--display);font-size:14px;letter-spacing:1.2px;color:var(--paper);
    background:linear-gradient(135deg,var(--tomato),var(--tomato2));border:3px solid var(--ink);border-radius:14px;
    padding:9px 16px;box-shadow:0 8px 0 rgba(32,48,44,.35);
    transition:transform .25s cubic-bezier(.2,1.6,.4,1),opacity .25s}
  #toast.on{transform:translate(-50%,0) scale(1);opacity:1}
  #toast.gold{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--ink)}
  /* ------- fullscreen menus ------- */
  #menuRoot{position:fixed;inset:0;z-index:80;display:none;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:radial-gradient(700px 400px at 82% -8%,rgba(242,177,52,.22),transparent 60%),
      radial-gradient(620px 420px at -10% 108%,rgba(224,74,58,.2),transparent 60%),
      linear-gradient(165deg,rgba(22,36,31,.97),rgba(21,84,81,.97))}
  #menuRoot.on{display:flex}
  .fs-panel{display:none;flex:1;min-height:0;flex-direction:column;gap:10px}
  .fs-panel.on{display:flex;animation:fsIn .26s cubic-bezier(.2,1.3,.4,1)}
  @keyframes fsIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fs-head{display:flex;align-items:center;gap:9px}
  .fs-head svg.ml{width:29px;height:29px;flex:0 0 auto}
  .fs-head .mn{font-family:var(--display);font-size:12px;letter-spacing:1.4px;color:var(--paper);text-transform:uppercase}
  .fs-head .sp{flex:1}
  .closeBtn{width:35px;height:35px;flex:0 0 auto;border-radius:50%;cursor:pointer;color:var(--paper);
    border:2px solid var(--ink3);background:linear-gradient(135deg,var(--tomato),var(--tomato2));
    font-family:var(--body);font-weight:900;font-size:15px;box-shadow:0 3px 0 var(--ink3);
    display:flex;align-items:center;justify-content:center}
  .closeBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink3)}
  .fs-mid{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;padding:4px 2px;scrollbar-color:var(--amber) rgba(0,0,0,.25)}
  .fs-mid::-webkit-scrollbar{width:8px}
  .fs-mid::-webkit-scrollbar-track{background:rgba(0,0,0,.25);border-radius:8px}
  .fs-mid::-webkit-scrollbar-thumb{background:linear-gradient(var(--amber),var(--amber2));border-radius:8px}
  .fs-title{margin:0;font-family:var(--display);font-size:clamp(25px,7.2vw,40px);letter-spacing:2px;line-height:1.05;
    color:var(--paper);text-transform:uppercase;text-shadow:0 3px 0 var(--ink3),0 0 26px rgba(242,177,52,.35)}
  .fs-tag{font-size:10px;font-weight:900;letter-spacing:2.4px;color:var(--amber);text-transform:uppercase}
  .fs-foot{display:flex;flex-direction:column;gap:9px;width:100%;max-width:420px;margin:0 auto}
  .howto{display:flex;gap:9px;width:100%;max-width:420px}
  .howto>div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 5px;
    background:rgba(255,248,234,.1);border:2px solid rgba(255,248,234,.28);border-radius:16px;
    color:var(--cream);font-size:10px;font-weight:700;line-height:1.35}
  .howto .ic{width:37px;height:37px;border-radius:50%;border:2px solid var(--ink3);display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--tomato),var(--tomato2));color:var(--paper);font-size:14px;font-weight:900;
    box-shadow:0 3px 0 var(--ink3)}
  .howto>div:nth-child(2) .ic{background:linear-gradient(135deg,var(--teal),var(--teal2))}
  .howto>div:nth-child(3) .ic{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--ink)}
  .howto .ic svg{width:17px;height:21px}
  .chip{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--ink);
    background:linear-gradient(135deg,var(--cream),var(--cream2));border:2px solid var(--ink3);border-radius:999px;
    padding:6px 14px;box-shadow:0 3px 0 var(--ink3)}
  .chip.gold{background:linear-gradient(135deg,var(--amber),var(--amber2))}
  .bigScore{font-family:var(--display);font-size:clamp(46px,14vw,72px);line-height:1;color:var(--amber);text-shadow:0 4px 0 var(--ink3)}
  .ribbon{display:none;font-size:10px;font-weight:900;letter-spacing:2px;color:var(--paper);
    background:linear-gradient(135deg,var(--success),#2c6b39);border:2px solid var(--ink3);border-radius:999px;
    padding:6px 15px;box-shadow:0 3px 0 var(--ink3)}
  .ribbon.on{display:block;animation:pulse .5s infinite alternate}
  .seg{display:flex;width:100%;border:2px solid var(--ink3);border-radius:14px;overflow:hidden;box-shadow:0 3px 0 var(--ink3)}
  .seg button{flex:1;min-width:0;font-family:var(--body);font-weight:900;font-size:12px;letter-spacing:.8px;padding:12px 4px;
    border:none;cursor:pointer;background:var(--cream2);color:var(--ink2);white-space:nowrap}
  .seg button.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--paper)}
  .btn{width:100%;font-family:var(--body);font-weight:900;font-size:14px;letter-spacing:1px;padding:14px 14px;
    border-radius:16px;border:2px solid var(--ink3);cursor:pointer;color:var(--paper);box-shadow:0 5px 0 var(--ink3)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink3)}
  .btn.red{background:linear-gradient(135deg,#f0685a,var(--tomato2))}
  .btn.amber{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--ink)}
  .btn.teal{background:linear-gradient(135deg,#2c8a85,var(--teal2))}
  .btn.ghost{background:rgba(255,248,234,.08);color:var(--cream);border-style:dashed;border-color:rgba(255,248,234,.5);box-shadow:none}
  .btn.ghost:active{transform:translateY(2px)}
  .btnRow2{display:flex;gap:9px}
  .btnRow2 .btn{flex:1;min-width:0}
  .menuList{display:flex;flex-direction:column;gap:9px;width:100%;max-width:420px}
  .menuRow{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
    font-family:var(--body);color:var(--ink);background:linear-gradient(180deg,var(--paper),var(--cream));
    border:2px solid var(--ink3);border-radius:16px;padding:12px 13px;box-shadow:0 4px 0 var(--ink3)}
  .menuRow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink3)}
  .menuRow .mic{width:33px;height:33px;flex:0 0 auto;border-radius:11px;border:2px solid var(--ink3);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;
    background:linear-gradient(135deg,var(--teal),var(--teal2));color:var(--paper)}
  .menuRow:nth-child(2n) .mic{background:linear-gradient(135deg,var(--tomato),var(--tomato2))}
  .menuRow:nth-child(3n) .mic{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--ink)}
  .menuRow .txt{min-width:0;font-weight:900;font-size:13px;letter-spacing:.4px}
  .menuRow .txt small{display:block;font-weight:700;font-size:10px;color:var(--ink2);letter-spacing:.2px;margin-top:2px}
  .menuRow .chev{margin-left:auto;color:var(--teal);font-size:16px;font-weight:900}
  .rules{display:flex;flex-direction:column;gap:8px;width:100%;max-width:420px;text-align:left;margin:0;padding:0}
  .rules li{list-style:none;display:flex;gap:10px;align-items:flex-start;padding:9px 12px;
    background:rgba(255,248,234,.1);border:2px solid rgba(255,248,234,.25);border-radius:14px;
    color:var(--cream);font-size:12px;font-weight:500;line-height:1.45}
  .rules li b{color:var(--amber)}
  .rules .num{flex:0 0 auto;width:23px;height:23px;border-radius:50%;border:2px solid var(--ink3);
    background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--ink);
    font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center}
  .keysGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:100%;max-width:420px}
  .keysGrid div{padding:8px;background:rgba(255,248,234,.1);border:2px solid rgba(255,248,234,.25);border-radius:12px;
    color:var(--cream);font-size:10px;font-weight:700;letter-spacing:.4px}
  .keysGrid b{display:block;color:var(--amber);font-size:11px;margin-bottom:2px}
  .aboutLogo{width:80px;height:80px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
  .aboutText{max-width:400px;margin:0;color:var(--cream);font-size:13px;line-height:1.6;font-weight:500;white-space:pre-line}
  .series{display:flex;flex-direction:column;gap:7px;width:100%;max-width:420px}
  .series div{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(255,248,234,.1);
    border:2px solid rgba(255,248,234,.25);border-radius:14px;color:var(--cream);font-size:12px;font-weight:900;letter-spacing:.4px}
  .series .st{margin-left:auto;font-size:9px;font-weight:900;letter-spacing:1px;border-radius:999px;padding:4px 9px;border:2px solid var(--ink3)}
  .st.live{background:linear-gradient(135deg,var(--success),#2c6b39);color:var(--paper)}
  .st.dev{background:linear-gradient(135deg,var(--amber),var(--amber2));color:var(--ink)}
  .st.plan{background:rgba(255,248,234,.2);color:var(--cream)}
  /* ------- skins ------- */
  .skinStrip{display:flex;gap:8px;justify-content:center;width:100%;max-width:420px}
  .skinDot{flex:0 0 auto;width:56px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
    background:none;border:none;padding:0;font-family:var(--body)}
  .skinDot .sw{position:relative;width:48px;height:48px;border-radius:50%;border:3px solid rgba(255,248,234,.35);
    background:rgba(255,248,234,.12);display:flex;align-items:center;justify-content:center;transition:transform .12s,border-color .12s,box-shadow .12s}
  .skinDot .sw svg{width:38px;height:38px;display:block}
  .skinDot .sn{font-size:8px;font-weight:900;letter-spacing:.6px;color:var(--cream);text-transform:uppercase;opacity:.85}
  .skinDot.on .sw{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,177,52,.3),0 4px 0 var(--ink3);transform:scale(1.08)}
  .skinDot.on .sn{color:var(--amber);opacity:1}
  .skinDot:active .sw{transform:scale(.94)}
  .skinDot.locked .sw{filter:grayscale(.75) brightness(.62)}
  .skinDot.locked .sn{opacity:.5}
  .lockIco{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;
    background:linear-gradient(135deg,var(--tomato),var(--tomato2));border:2px solid var(--ink3);
    display:flex;align-items:center;justify-content:center}
  .lockIco svg{width:10px;height:10px;display:block}
  .skinGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
  .skinCard{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 8px 10px;cursor:pointer;
    background:rgba(255,248,234,.1);border:2px solid rgba(255,248,234,.28);border-radius:18px;font-family:var(--body);
    transition:transform .12s,border-color .12s,background .12s}
  .skinCard:active{transform:scale(.96)}
  .skinCard .sw{position:relative;width:74px;height:74px;border-radius:50%;border:3px solid rgba(255,248,234,.3);
    background:rgba(22,36,31,.35);display:flex;align-items:center;justify-content:center}
  .skinCard .sw svg.cat{width:60px;height:60px;display:block}
  .skinCard .sn{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--cream);text-transform:uppercase}
  .skinCard .sd{font-size:9px;font-weight:700;color:rgba(247,236,215,.7);line-height:1.35}
  .skinCard .pick{font-size:8px;font-weight:900;letter-spacing:1.4px;color:var(--ink);border-radius:999px;padding:3px 10px;
    background:linear-gradient(135deg,var(--amber),var(--amber2));border:2px solid var(--ink3);opacity:0;transform:scale(.7);transition:opacity .15s,transform .15s}
  .skinCard.on{border-color:var(--amber);background:rgba(242,177,52,.14)}
  .skinCard.on .sw{border-color:var(--amber)}
  .skinCard.on .pick{opacity:1;transform:scale(1)}
  .skinCard.locked .sw{filter:grayscale(.75) brightness(.62)}
  .skinCard.locked .sn,.skinCard.locked .sd{opacity:.55}
  .skinCard.locked .pick{opacity:1;transform:scale(1);background:linear-gradient(135deg,#5a6672,#3c4650);color:var(--cream)}
  .skinCard .lockIco{width:24px;height:24px;right:6px;bottom:6px}
  .skinCard .lockIco svg{width:12px;height:12px}
  .lvlBar{width:100%;max-width:420px;height:8px;border-radius:999px;border:2px solid var(--ink3);
    background:rgba(22,36,31,.4);overflow:hidden}
  .lvlBar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--amber));transition:width .4s}
  @media (max-height:680px){
    .howto{display:none}
    .fs-mid{gap:8px}
    .fs-title{font-size:clamp(21px,6vw,30px)}
    .bigScore{font-size:clamp(38px,12vw,56px)}
    .btn{padding:12px 12px;font-size:13px}
    .rules li{padding:7px 10px;font-size:11px}
    .skinCard .sd{display:none}
    .skinCard .sw{width:58px;height:58px}
    .skinCard .sw svg.cat{width:46px;height:46px}
  }
  @media (max-height:500px){ .keysGrid,.series,.aboutText{display:none} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="logoMark">
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#1f6f6b" stroke="#20302c" stroke-width="3"/>
    <rect x="6" y="6" width="36" height="36" rx="9" fill="none" stroke="#f7ecd7" stroke-width="1.6" opacity=".55"/>
    <path d="M24 8l4.6 10.4 11.4 1.1-8.6 7.6 2.6 11.2L24 32.4l-10 5.9 2.6-11.2-8.6-7.6 11.4-1.1z" fill="#e04a3a" stroke="#20302c" stroke-width="2"/>
    <ellipse cx="24" cy="24" rx="4.6" ry="6" fill="#fff8ea" stroke="#20302c" stroke-width="1.6"/>

function computeLayout(){
  var playTop=TOP_PAD,playBottom=H-BOT_PAD;
  var availH=playBottom-playTop;
  if(availH<220){playTop=Math.max(40,H*0.12);playBottom=H-Math.max(56,H*0.12);availH=playBottom-playTop;}
  var s=Math.min(W/440,availH/360);
  if(!isFinite(s)||s<=0)s=1;
  s=Math.max(0.66,Math.min(1.6,s));
  var cs=s*CFG.catBoost,bs=cs*0.95;
  var cx=W/2,groundY=playBottom-8,ay=groundY-52*cs;
  var dx=Math.min(64*cs,W*0.24),ox=Math.min(64*cs+113*s,W*0.46);
  var lowerY=ay-18*cs,upperY=ay-78*cs;
  var catchPts=[{x:cx-dx,y:upperY},{x:cx-dx,y:lowerY},{x:cx+dx,y:upperY},{x:cx+dx,y:lowerY}];
  var origins=[{x:cx-ox,y:upperY-78*s},{x:cx-ox,y:lowerY-78*s},
               {x:cx+ox,y:upperY-78*s},{x:cx+ox,y:lowerY-78*s}];
  L={playTop:playTop,playBottom:playBottom,s:s,cs:cs,bs:bs,cx:cx,groundY:groundY,ax:cx,ay:ay,
     catchPts:catchPts,origins:origins,splitY:(upperY+lowerY)/2};
}

var actx=null,master=null;
function audio(){
  try{
    if(!actx){var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      actx=new AC();master=actx.createGain();master.gain.value=muted?0:1;master.connect(actx.destination);}
    if(actx.state==='suspended')actx.resume();
  }catch(e){}
}
function tone(f,dur,type,gain,slide,delay){
  if(!actx||muted)return;
  try{
    var t0=actx.currentTime+(delay||0);
    var o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
    if(slide)o.frequency.exponentialRampToValueAtTime(slide,t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(gain||0.05,t0+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dur+0.05);
  }catch(e){}
}
function noise(dur,gain,freq){
  if(!actx||muted)return;
  try{
    var n=Math.floor(actx.sampleRate*dur),buf=actx.createBuffer(1,n,actx.sampleRate),d=buf.getChannelData(0);
    for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
    var src=actx.createBufferSource();src.buffer=buf;
    var f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||900;
    var g=actx.createGain();g.gain.value=gain||0.08;
    src.connect(f);f.connect(g);g.connect(master);src.start();
  }catch(e){}
}

function drawParticles(){
  for(var i=0;i<particles.length;i++){
    var p=particles[i],a=Math.max(0,p.life/p.max);
    ctx.save();ctx.globalAlpha=a;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;
    if(p.type==='spark'){
      ctx.beginPath();
      for(var k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.moveTo(0,0);ctx.lineTo(p.size*1.8,0);ctx.lineTo(0,p.size*0.5);}
      ctx.fill();

      ctx.beginPath();ctx.moveTo(-p.size,p.size);ctx.lineTo(0,-p.size);ctx.lineTo(p.size,p.size);ctx.closePath();ctx.fill();
    }else if(p.type==='confetti'){ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.6);}

function render(){
  if(!L)return;
  ctx.clearRect(0,0,W,H);

}

/* ---------- HUD / menus ---------- */
function paintHud(){
  var t=T(),pl=playerLevel();
  elScore.textContent=score;
  elBest.textContent=t.best+' '+best+' · '+t.lvlShort+' '+pl;
  $('scoreLabel').textContent=t.score;
  var lh='';
  for(var i=0;i<3;i++){
    var alive=i<lives;
    lh+='<svg viewBox="0 0 16 20"><ellipse cx="8" cy="10" rx="6.5" ry="8.5" fill="'+(alive?'#fffdf6':'rgba(32,48,44,.15)')+'" stroke="#20302c" stroke-width="1.6"/>'
      +(alive?'<ellipse cx="5.6" cy="6.6" rx="1.6" ry="2.2" fill="#fff"/>':'<path d="M4 8l3 3-2 3 4 2" stroke="#20302c" stroke-width="1.3" fill="none"/>')+'</svg>';
  }
  elLives.innerHTML=lh;
  elSpeed.style.width=(8+Math.min(7,level())/7*92)+'%';
  if(streak>=3){elCombo.classList.add('on');elCombo.textContent='×'+streak+' '+t.combo;}
  else elCombo.classList.remove('on');
  $('startBest').textContent=t.finalBest+best+' · '+t.yourLevel+' '+pl;
  $('pauseScore').textContent=t.score+': '+score+' · '+t.best+': '+best;
  $('skLevel').textContent=t.yourLevel+' '+pl+' · '+t.lvlHint;
  var next=SKINS.filter(function(sk){return sk.lvl>pl;})[0];
  var frac=next?((best%CFG.lvlStep)/CFG.lvlStep):1;
  $('skLvlFill').style.width=Math.round(frac*100)+'%';
  $('overLevel').textContent=t.yourLevel+' '+pl+(next?(' · '+t.needLevel+' '+next.lvl+' → '+t.sk[next.id][0]):'');
}
function popScore(){elScore.classList.remove('pop');void elScore.offsetWidth;elScore.classList.add('pop');}
function syncMenu(){
  var name=menuOverride;
  if(!name)name=state==='idle'?'start':state==='paused'?'pause':state==='over'?'over':null;
  for(var k in panels)panels[k].classList.toggle('on',k===name);
  menuRoot.classList.toggle('on',!!name);
  if(name==='over'){
    $('finalScore').textContent=score;
    $('finalBest').textContent=T().finalBest+best;
    $('newRecord').classList.toggle('on',score>bestAtRunStart&&score>0);
    $('btnRevive').style.display=usedRevive?'none':'';
  }
  paintHud();
}
function openOverride(name){
  if(state==='playing'){autoResume=true;state='paused';if(gp&&gp.gameplayStop){try{gp.gameplayStop();}catch(e){}}}
  menuOverride=name;syncMenu();SFX.click();
}
function closeOverride(){
  menuOverride=null;
  if(autoResume){autoResume=false;state='playing';if(gp&&gp.gameplayStart){try{gp.gameplayStart();}catch(e){}}}
  syncMenu();SFX.click();
}
function syncSeg(){
  var list=document.querySelectorAll('#segDock button,#segStart button');
  for(var i=0;i<list.length;i++)list[i].classList.toggle('on',list[i].getAttribute('data-mode')===mode);
}

   +'<path d="M17 23l2-8 6 5z" fill="'+sk.ear+'"/>'
   +'<path d="M47 23l-2-8-6 5z" fill="'+sk.ear+'"/>'
   +'<circle cx="32" cy="36" r="20" fill="'+sk.fur+'" stroke="#20302c" stroke-width="2"/>'
   +'<path d="M26 18l2 6M32 16l0 7M38 18l-2 6" stroke="'+sk.stripe+'" stroke-width="2.4" stroke-linecap="round"/>'
   +'<ellipse cx="32" cy="44" rx="11" ry="8" fill="'+sk.chest+'"/>'
   +'<ellipse cx="24" cy="34" rx="4.6" ry="4.2" fill="#eaf4d8"/>'
   +'<ellipse cx="40" cy="34" rx="4.6" ry="4.2" fill="#eaf4d8"/>'
   +'<circle cx="24" cy="34" r="2.6" fill="'+sk.eye+'"/><circle cx="40" cy="34" r="2.6" fill="'+sk.eye+'"/>'

   +'<path d="M30 42h4l-2 3z" fill="#e88a8a"/>'

   +'<path d="M13 25q-4 8 1 14l6-2q-3-6-1-11z" fill="#e9dcc4" stroke="#20302c" stroke-width="1.6"/>'
   +'<path d="M51 25q4 8-1 14l-6-2q3-6 1-11z" fill="#e9dcc4" stroke="#20302c" stroke-width="1.6"/>'
   +'<ellipse cx="32" cy="26" rx="21" ry="5" fill="#e9dcc4" stroke="#20302c" stroke-width="1.6"/>'
   +'<circle cx="32" cy="18" r="5" fill="#cc2b1f" stroke="#f4c542" stroke-width="1.4"/>'
   +'<path d="M32 14.4l1 2.2 2.4.2-1.8 1.6.6 2.3-2.2-1.3-2.2 1.3.6-2.3-1.8-1.6 2.4-.2z" fill="#f4c542"/>'
   +'</svg>';
}
var LOCK_SVG='<span class="lockIco"><svg viewBox="0 0 16 16"><use href="#lockMark"/></svg></span>';
function renderSkinPickers(){
  var t=T(),pl=playerLevel();
  var sh='',gh='';
  for(var i=0;i<SKINS.length;i++){
    var sk=SKINS[i],on=sk.id===skin.id,un=skinUnlocked(sk),nm=t.sk[sk.id][0],ds=t.sk[sk.id][1];
    sh+='<button class="skinDot'+(on?' on':'')+(un?'':' locked')+'" data-skin="'+sk.id+'" title="'+nm+'">'
      +'<span class="sw">'+skinSVG(sk,38)+(un?'':LOCK_SVG)+'</span><span class="sn">'+nm+'</span></button>';
    gh+='<button class="skinCard'+(on?' on':'')+(un?'':' locked')+'" data-skin="'+sk.id+'">'
      +'<span class="sw">'+skinSVG(sk,60)+(un?'':LOCK_SVG)+'</span><span class="sn">'+nm+'</span>'
      +'<span class="sd">'+ds+'</span><span class="pick">'+(un?t.chosen:(t.level+' '+sk.lvl))+'</span></button>';
  }
  $('skinStrip').innerHTML=sh;$('skinGrid').innerHTML=gh;
  var dots=document.querySelectorAll('[data-skin]');
  for(var d=0;d<dots.length;d++){
    dots[d].addEventListener('click',function(){setSkin(this.getAttribute('data-skin'));});
  }
}
function setSkin(id){
  var sk=null;
  for(var i=0;i<SKINS.length;i++)if(SKINS[i].id===id)sk=SKINS[i];
  if(!sk)return;
  if(!skinUnlocked(sk)){
    SFX.deny();
    toast(T().needLevel+' '+sk.lvl+' ('+T().nowLevel+' '+playerLevel()+')',1800);
    return;
  }
  skin=sk;
  try{localStorage.setItem('rc_skin',id);}catch(e){}
  renderSkinPickers();paintHud();
  toast(T().sk[id][0],1200,true);
  SFX.skin();
  if(L)burst(L.ax,L.ay-40*L.cs,'spark',12,[skin.fur,skin.light,PAL.amber,PAL.paper]);
}
function checkUnlocks(){
  var pl=playerLevel();
  if(pl>lastPlayerLevel){
    lastPlayerLevel=pl;
    for(var i=0;i<SKINS.length;i++){
      if(SKINS[i].lvl===pl){
        toast(T().newSkin+': '+T().sk[SKINS[i].id][0],2400,true);
        SFX.unlock();
        if(L)burst(L.cx,L.playTop+90,'confetti',30,[PAL.tomato,PAL.amber,PAL.teal,PAL.sky,PAL.paper]);
        renderSkinPickers();
      }
    }
    paintHud();
  }
}

/* ---------- flow ---------- */
function start(m){
  mode=m;baseLevel=m==='B'?5:0;lastLevel=baseLevel;
  score=0;catches=0;lives=CFG.lives;eggs=[];splats=[];particles=[];floats=[];ripples=[];
  basketEggs=0;streak=0;stepTimer=0;spawnTimer=0;usedRevive=false;
  bestAtRunStart=best;shake=0;missFlash=0;sadT=0;firstCatch=false;tutorialT=6000;
  pos=1;pose=0;poseTarget=0;flipPlayed=true;
  menuOverride=null;autoResume=false;state='playing';
  syncSeg();syncMenu();
  if(gp&&gp.gameplayStart){try{gp.gameplayStart();}catch(e){}}
  audio();SFX.click();toast(T().tapHint,3200);
}
function pause(){if(state!=='playing')return;state='paused';
  if(gp&&gp.gameplayStop){try{gp.gameplayStop();}catch(e){}}syncMenu();}
function resume(){if(state!=='paused')return;state='playing';menuOverride=null;autoResume=false;
  syncMenu();if(gp&&gp.gameplayStart){try{gp.gameplayStart();}catch(e){}}}
function gameOver(){
  state='over';SFX.over();
  if(gp&&gp.gameplayStop){try{gp.gameplayStop();}catch(e){}}
  submitScore();checkUnlocks();syncMenu();
}
function restart(){
  var now=Date.now();
  if(now-lastFs>CFG.fsCooldown){lastFs=now;ads.fullscreen().then(function(){start(mode);});}
  else start(mode);
}
function revive(){
  if(usedRevive||state!=='over')return;
  ads.rewarded().then(function(ok){
    if(!ok)return;
    usedRevive=true;lives=CFG.reviveLives;eggs=[];splats=[];streak=0;sadT=0;
    state='playing';syncMenu();SFX.revive();
    if(gp&&gp.gameplayStart){try{gp.gameplayStart();}catch(e){}}
    toast(T().reviveToast,1300);
  });
}
function isUpper(p){return p===0||p===2;}
function setPos(p){
  if(state!=='playing'||p===pos)return;
  pos=p;poseTarget=isUpper(p)?1:0;
  if(Math.abs(pose-poseTarget)>0.5)flipPlayed=false;
  SFX.tap();
}
function spawnEgg(){
  if(eggs.length>=CFG.maxEggs)return;
  var free=[0,1,2,3].filter(function(c){return !eggs.some(function(e){return e.chute===c&&e.step===0;});});
  if(!free.length)return;
  var ch=free[Math.floor(Math.random()*free.length)];
  eggs.push({chute:ch,step:0});henLay[ch]=340;SFX.cluck();
}
function onCatch(ch){
  var c=L.catchPts[ch];
  firstCatch=true;tutorialT=0;
  catches++;streak++;score++;basketEggs++;basketPop=220;catchGlow=260;happyT=300;
  SFX.catch(streak);popScore();
  burst(c.x,c.y-10*L.s,'spark',8,[PAL.amber,PAL.paper,PAL.amber2]);
  addFloat(c.x,c.y-26*L.s,'+1',PAL.paper);
  if(streak>0&&streak%5===0){score+=2;addFloat(c.x,c.y-44*L.s,'+2 '+T().combo,PAL.amber);
    burst(c.x,c.y-16*L.s,'confetti',10,[PAL.tomato,PAL.amber,PAL.teal,PAL.paper]);}
  if(basketEggs>=CFG.crateSize){
    basketEggs=0;score+=CFG.crateBonus;
    toast(T().crate+' +'+CFG.crateBonus,1500);SFX.crate();
    burst(c.x,c.y-10*L.s,'confetti',26,[PAL.tomato,PAL.amber,PAL.teal,PAL.sky,PAL.paper]);
    addFloat(c.x,c.y-58*L.s,'+'+CFG.crateBonus,PAL.amber);
  }
  var nl=level();
  if(nl>lastLevel){lastLevel=nl;toast(T().level+' '+(nl+1)+' · '+T().faster,1400);SFX.level();
    burst(L.cx,L.playTop+80,'confetti',18,[PAL.tomato,PAL.amber,PAL.teal,PAL.paper]);}
  if(score>best){best=score;try{localStorage.setItem('rc_best',String(best));}catch(e){}checkUnlocks();}
  paintHud();
}
function onMiss(ch){
  var c=L.catchPts[ch];
  lives--;streak=0;sadT=1000;shake=7;missFlash=420;
  splats.push({x:c.x,y:L.groundY-2,life:1600});
  burst(c.x,L.groundY-10,'drop',12,[PAL.yolk,'#f9d976']);
  burst(c.x,L.groundY-12,'shell',7,[PAL.white,'#e3d3b8']);
  SFX.miss();paintHud();
  if(lives<=0)gameOver();
}
function stepEggs(){
  for(var i=eggs.length-1;i>=0;i--){
    var e=eggs[i];e.step++;
    if(e.step>=CFG.steps-1){
      eggs.splice(i,1);
      if(pos===e.chute)onCatch(e.chute);
      else{onMiss(e.chute);if(state!=='playing')return;}
    }
  }
}
function update(dt){
  tGlobal+=dt;windmill+=dt*0.0006;
  for(var i=0;i<clouds.length;i++){var cl=clouds[i];cl.x+=dt*cl.v;if(cl.x>1.15)cl.x=-0.15;}
  birdTimer-=dt;
  if(birdTimer<=0&&L){birdTimer=rnd(9000,16000);
    birds.push({x:-40,y:L.playTop+rnd(30,120),v:rnd(28,44),n:3+Math.floor(Math.random()*3)});}
  for(var b=birds.length-1;b>=0;b--){birds[b].x+=birds[b].v*dt/1000;if(birds[b].x>W+80)birds.splice(b,1);}
  for(var q=0;q<pollen.length;q++){var pp=pollen[q];pp.y-=pp.v*dt/1000/H;
    pp.x+=Math.sin(tGlobal/900+pp.s)*0.0002;if(pp.y<-0.02){pp.y=1.02;pp.x=Math.random();}}
  for(var h=0;h<4;h++)henLay[h]=Math.max(0,henLay[h]-dt);
  shake=Math.max(0,shake-dt*0.02);missFlash=Math.max(0,missFlash-dt);
  catchGlow=Math.max(0,catchGlow-dt);basketPop=Math.max(0,basketPop-dt);
  happyT=Math.max(0,happyT-dt);sadT=Math.max(0,sadT-dt);tutorialT=Math.max(0,tutorialT-dt);
  blinkT-=dt;if(blinkT<=0){blinkPhase=130;blinkT=rnd(2400,5200);}
  blinkPhase=Math.max(0,blinkPhase-dt);
  var dp=poseTarget-pose;
  if(Math.abs(dp)>0.001){
    pose+=(dp>0?1:-1)*Math.min(Math.abs(dp),dt/240);
    if(!flipPlayed){flipPlayed=true;SFX.flip();if(L)burst(L.ax,L.ay,'spark',10,[PAL.paper,PAL.amber,PAL.sky]);}
  }else pose=poseTarget;
  for(var a=particles.length-1;a>=0;a--){var p=particles[a];
    p.life-=dt;if(p.life<=0){particles.splice(a,1);continue;}
    p.vy+=p.g*dt/1000;p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.rot+=p.vr*dt/1000;}
  for(var c=floats.length-1;c>=0;c--){floats[c].life-=dt;if(floats[c].life<=0)floats.splice(c,1);}
  for(var d=splats.length-1;d>=0;d--){splats[d].life-=dt;if(splats[d].life<=0)splats.splice(d,1);}
  for(var e=ripples.length-1;e>=0;e--){ripples[e].life-=dt;if(ripples[e].life<=0)ripples.splice(e,1);}
  if(state!=='playing'||!L)return;
  stepTimer+=dt;spawnTimer+=dt;
  var guard=0;
  while(stepTimer>=stepInterval()&&guard<8){stepTimer-=stepInterval();guard++;stepEggs();if(state!=='playing')return;}
  if(spawnTimer>=spawnInterval()){spawnTimer=0;spawnEgg();}
}
var last=0;
function frame(now){
  if(!last)last=now;
  var dt=Math.min(50,now-last);last=now;
  try{update(dt);render();}catch(err){if(!bootErr){bootErr=true;console.error(err);}}
  requestAnimationFrame(frame);
}

/* ---------- i18n ---------- */
function setText(id,v){var el=$(id);if(el)el.textContent=v;}
function applyLang(l){
  if(I18N[l])lang=l;
  var t=T();
  setText('tTitle',t.title);setText('tTag',t.tag);setText('pTitle',t.pause);setText('pTag',t.pauseTag);
  setText('oTitle',t.over);setText('hTitle',t.how);setText('aTag',t.studioTag);setText('aboutText',t.about);
  setText('btnStart',t.start);setText('btnResume',t.resume);setText('btnRestartPause',t.restart2);
  setText('btnRestartOver',t.restart);setText('btnRevive',t.revive);setText('btnGotIt',t.gotIt);setText('btnBack',t.back);
  setText('btnHelpStart',t.how);setText('btnSkinsPause',t.skins);setText('btnSkinsOver',t.skins);setText('btnSkinsBack',t.back);
  setText('skTitle',t.skins);setText('skTag',t.skinsTag);setText('skinHint',t.skinHint);
  ['btnTopStart','btnTopPause','btnTopOver'].forEach(function(id){setText(id,t.top);});
  setText('sA',t.gameA);setText('sB',t.gameBfast);
  var dock=document.querySelectorAll('#segDock button');
  if(dock[0])dock[0].textContent=t.gameA;if(dock[1])dock[1].textContent=t.gameB;
  var pb=document.querySelector('#btnPause span');if(pb)pb.textContent=t.pause;
  var rb=document.querySelector('#btnRestart span');if(rb)rb.textContent=t.restart2;
  var kb=document.querySelector('#btnSkinsDock span');if(kb)kb.textContent=t.skinBtn;
  var tb=document.querySelector('#btnTop span');if(tb)tb.textContent=t.topShort;
  setText('newRecord',t.newRec);setText('verChip',t.ver);
  setText('mNew',t.mNew);setText('mNewSub',t.mNewSub);setText('mCont',t.mCont);setText('mContSub',t.mContSub);
  setText('mTop',t.mTop);setText('mTopSub',t.mTopSub);setText('mSoundSub',t.mSoundSub);
  setText('mHelp',t.mHelp);setText('mHelpSub',t.mHelpSub);setText('mAbout',t.mAbout);setText('mAboutSub',t.mAboutSub);
  setText('mSkins',t.mSkins);setText('mSkinsSub',t.mSkinsSub);
  var eggSvg='<svg viewBox="0 0 16 20"><ellipse cx="8" cy="10" rx="6.5" ry="8.5" fill="#fff8ea" stroke="#20302c" stroke-width="1.6"/><ellipse cx="5.6" cy="6.6" rx="1.6" ry="2.2" fill="#fff"/></svg>';
  $('howto').innerHTML=[['✥','h1'],[eggSvg,'h2'],['×5','h3']].map(function(pair){
    return '<div><span class="ic">'+pair[0]+'</span><span>'+t[pair[1]].replace(/\n/g,'<br>')+'</span></div>';}).join('');
  $('rules').innerHTML=[1,2,3,4,5,6].map(function(i){
    return '<li><span class="num">'+i+'</span><span>'+t['r'+i]+'</span></li>';}).join('');
  $('keysGrid').innerHTML=[1,2,3,4].map(function(i){
    return '<div><b>'+t['k'+i]+'</b>'+t['k'+i+'v']+'</div>';}).join('');
  $('series').innerHTML=[1,2,3].map(function(i){
    return '<div><span>'+t['s'+i]+'</span><span class="st '+['live','dev','plan'][i-1]+'">'+t['s'+i+'st']+'</span></div>';}).join('');
  renderSkinPickers();
  paintSound();paintHud();
}

/* ---------- wiring ---------- */
function on(id,fn){var el=$(id);if(el)el.addEventListener('click',fn);}
canvas.addEventListener('pointerdown',function(e){
  e.preventDefault();audio();
  if(state!=='playing'||!L)return;
  var x=e.clientX,y=e.clientY;
  ripples.push({x:x,y:y,life:420,max:420});
  var left=x<L.cx,top=y<L.splitY;
  setPos(top?(left?0:2):(left?1:3));
});
canvas.addEventListener('contextmenu',function(e){e.preventDefault();});
var segBtns=document.querySelectorAll('#segDock button,#segStart button');
for(var si=0;si<segBtns.length;si++){
  segBtns[si].addEventListener('click',function(){
    mode=this.getAttribute('data-mode');syncSeg();SFX.click();
    if(state==='playing'||state==='paused')start(mode);
  });
}
on('logoChip',function(){openOverride('studio');});
on('btnMenuTop',function(){openOverride('studio');});
on('btnStart',function(){start(mode);});
on('btnResume',resume);
on('btnRestartPause',restart);
on('btnRestartOver',restart);
on('btnRevive',revive);
on('btnRestart',function(){if(state==='idle')start(mode);else restart();});
on('btnPause',function(){if(state==='playing')pause();else if(state==='paused')resume();});
on('btnSkinsDock',function(){openOverride('skins');});
on('btnSkinsPause',function(){openOverride('skins');});
on('btnSkinsOver',function(){openOverride('skins');});
['btnTop','btnTopStart','btnTopPause','btnTopOver'].forEach(function(id){on(id,openTop);});
on('btnHelpStart',function(){openOverride('help');});
on('sndTop',function(){audio();setMuted(!muted);SFX.click();});
var sndBtns=document.querySelectorAll('.sndBtn');
for(var sb=0;sb<sndBtns.length;sb++)sndBtns[sb].addEventListener('click',function(){audio();setMuted(!muted);SFX.click();});
var closeBtns=document.querySelectorAll('[data-close]');
for(var cb=0;cb<closeBtns.length;cb++)closeBtns[cb].addEventListener('click',closeOverride);
var rows=document.querySelectorAll('.menuRow');
for(var ri=0;ri<rows.length;ri++){
  rows[ri].addEventListener('click',function(){
    var act=this.getAttribute('data-act');
    if(act==='new')start(mode);
    else if(act==='continue'){menuOverride=null;
      if(state==='paused'){autoResume=false;resume();}
      else if(state==='over')syncMenu();
      else start(mode);}
    else if(act==='top')openTop();
    else if(act==='sound'){audio();setMuted(!muted);SFX.click();}
    else if(act==='help')openOverride('help');
    else if(act==='skins')openOverride('skins');
    else if(act==='about')openOverride('about');
  });
}
window.addEventListener('keydown',function(e){
  var k=e.code;audio();
  if(k==='KeyQ')setPos(0);else if(k==='KeyA')setPos(1);
  else if(k==='KeyP')setPos(2);else if(k==='KeyL')setPos(3);
  else if(k==='ArrowLeft')setPos(pos%2);else if(k==='ArrowRight')setPos(2+pos%2);
  else if(k==='ArrowUp')setPos(pos<2?0:2);else if(k==='ArrowDown')setPos(pos<2?1:3);
  else if(k==='KeyM')setMuted(!muted);
  else if(k==='Escape'){if(menuOverride)closeOverride();else if(state==='playing')pause();else if(state==='paused')resume();}
  else if(k==='Space'||k==='Enter'){
    if(menuOverride&&menuOverride!=='start')return;
    e.preventDefault();
    if(state==='idle')start(mode);else if(state==='paused')resume();else if(state==='over')restart();
  }
});
document.addEventListener('visibilitychange',function(){if(document.hidden)pause();});
document.addEventListener('pointerdown',function(){audio();},{passive:true});

/* ---------- boot ---------- */
lastPlayerLevel=playerLevel();
if(!skinUnlocked(skin))skin=SKINS[0];
applyLang(lang);
syncSeg();
syncMenu();
try{resize();}catch(err){console.error(err);computeLayout();}
requestAnimationFrame(frame);
})();
</script>
